<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin: 0; background: #0d0906; display: flex; flex-direction: column; align-items: center; gap: 40px; padding: 60px 0; }
  .row { display: flex; align-items: center; gap: 28px; }
  .sym { width: 300px; height: 300px; filter: drop-shadow(0 0 40px rgba(255,92,0,.45)); }
  .sym-sm { width: 120px; height: 120px; filter: drop-shadow(0 0 18px rgba(255,92,0,.4)); }
  .lockup-text { color: #f5f0ea; font-family: 'Segoe UI', Roboto, Arial, sans-serif; font-weight: 800; font-size: 64px; letter-spacing: 10px; }
  .lockup-text span { color: #ff5c00; }
  .cap { color: #9a8f85; font: 12px monospace; letter-spacing: 3px; text-transform: uppercase; }
  .card { background: #141010; border: 1px solid rgba(255,92,0,.25); border-radius: 24px; padding: 48px; display: flex; flex-direction: column; align-items: center; gap: 24px; box-shadow: 0 0 80px rgba(255,92,0,.18) inset, 0 0 60px rgba(255,92,0,.12); }
</style></head><body>
  <div class="cap">1 · symbol only</div>
  <img class="sym" src="ikhnova-symbol.svg"/>
  <div class="cap">2 · hero card (seperti di situs)</div>
  <div class="card"><img class="sym-sm" src="ikhnova-symbol.svg"/><div class="lockup-text">IKH<span>NOVA</span></div></div>
  <div class="cap">3 · lockup horizontal</div>
  <div class="row"><img class="sym-sm" src="ikhnova-symbol.svg"/><div class="lockup-text" style="font-size:52px">IKH<span>NOVA</span></div></div>
</body></html>
